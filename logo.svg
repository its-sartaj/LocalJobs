<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Vibrant App Store Saffron-Amber Gradient -->
    <linearGradient id="squircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Warm Inner Dome Gradient -->
    <linearGradient id="domeGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.8" />
    </linearGradient>

    <!-- Dual Tone Pin Gradient -->
    <linearGradient id="pinLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="pinRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Pin Soft Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#ea580c" flood-opacity="0.25" />
    </filter>

    <!-- Outer Squircle Shadow -->
    <filter id="iconShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ea580c" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- 1. Apple-style Squircle Badge Container -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#squircleGrad)" filter="url(#iconShadow)" />
  <!-- Inner top glass highlight -->
  <rect x="9" y="9" width="102" height="52" rx="27" fill="#ffffff" opacity="0.18" />

  <!-- 2. Arched White Portal / Light Frame -->
  <path d="M 30 96 L 30 50 C 30 34 43 22 60 22 C 77 22 90 34 90 50 L 90 96 C 90 96 77 100 60 100 C 43 100 30 96 30 96 Z" fill="url(#domeGrad)" />

  <!-- 3. Gabled House Roof (Craftsman Home) -->
  <path d="M 60 38 L 38 54 L 43 59 L 60 46 L 77 59 L 82 54 Z" fill="#ea580c" />
  <!-- Chimney -->
  <rect x="71" y="42" width="6" height="10" fill="#c2410c" rx="1.5" />

  <!-- 4. Modern Hyperlocal Location Pin -->
  <g filter="url(#softGlow)">
    <!-- Left facet of pin -->
    <path d="M 60 48 C 49 48 45 56 45 64 C 45 74 58 87 60 89 C 60 89 60 89 60 48 Z" fill="url(#pinLeft)" />
    <!-- Right facet of pin (darker for 3D depth) -->
    <path d="M 60 48 C 71 48 75 56 75 64 C 75 74 62 87 60 89 C 60 89 60 89 60 48 Z" fill="url(#pinRight)" />
    <!-- Inner circular cut out -->
    <circle cx="60" cy="63" r="6.5" fill="#ffffff" />
  </g>

  <!-- 5. Shining 4-Point Compass Star / Craftsman Spark -->
  <g transform="translate(60, 34)">
    <!-- Outer Star -->
    <path d="M 0 -13 Q 0 0 13 0 Q 0 0 0 13 Q 0 0 -13 0 Q 0 0 0 -13 Z" fill="#0f172a" />
    <!-- Center Golden Core -->
    <circle cx="0" cy="0" r="2.8" fill="#fbbf24" />
  </g>
</svg>
